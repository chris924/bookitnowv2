# Frontend nginx: serves the built SPA and reverse-proxies the API.
#
# HTTP server. In production this typically sits behind a TLS terminator
# (see the commented HTTPS block below, or use Caddy — details in DEPLOYMENT.md).
server {
    listen 80;
    server_name _;

    # Larger bodies for avatar uploads (backend caps at 10MB).
    client_max_body_size 12M;

    # --- API reverse proxy ---
    # Browser calls https://<host>/api/... -> backend receives /... (prefix stripped
    # by the trailing slash on proxy_pass). Keeps the app same-origin, so the JWT
    # cookie is first-party and no cross-site CORS is required.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static SPA ---
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown routes serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

