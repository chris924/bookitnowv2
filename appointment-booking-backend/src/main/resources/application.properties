
spring.config.import=classpath:secrets.properties
spring.datasource.driver-class-name=${DRIVER_CLASSNAME}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${HIBERNATE-DDL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE-DIALECT}
spring.datasource.ssl.ca=${SSL-CA}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

avatar.directory.path=${AVATAR-DIRECTORY}
avatar.user.directory.path=${AVATAR-USER-DIRECTORY}

frontend.ip.address=${FRONTEND-IP-ADDRESS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB