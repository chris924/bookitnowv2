spring.application.name=appointment-booking
# PostgreSQL Configuration
spring.datasource.url=${DB_URL}  # Use environment variable from .env file
spring.datasource.username=${DB_USERNAME}  # Use environment variable from .env file
spring.datasource.password=${DB_PASSWORD}  # Use environment variable from .env file
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto (optional for testing purposes)
spring.jpa.hibernate.ddl-auto=update  # update schema automatically (for dev/test)