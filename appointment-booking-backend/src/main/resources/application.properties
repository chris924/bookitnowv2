# Backend configuration.
#
# Every value has a working default, so the app starts with no extra setup.
# Optional local overrides go in a git-ignored secrets.properties (see
# secrets.properties.example) or in environment variables.
spring.config.import=optional:classpath:secrets.properties

# --- Database ---
# In-memory H2 database, created on startup and filled with demo data by
# DatabaseSeeder. Set DB_URL / DB_USERNAME / DB_PASSWORD to use PostgreSQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookitnow;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE-DDL:create-drop}

# Set these to DEBUG / TRACE to see the generated SQL.
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type=INFO

# --- JWT cookie ---
# Frontend (http://localhost:5173) and backend (http://localhost:8080) run over plain HTTP,
# so the cookie must NOT be Secure or the browser will drop it.
# Same host = same-site, so Strict works.
app.cookie.secure=false
app.cookie.same-site=Strict

# --- CORS: frontend dev servers allowed to call the API ---
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# --- Avatars ---
# Relative paths resolve against the backend's working directory,
# which already contains uploads/avatars/default-avatar.jpg.
avatar.directory.path=${AVATAR-DIRECTORY:uploads/avatars}
avatar.user.directory.path=${AVATAR-USER-DIRECTORY:uploads/avatars/useravatars}

# Base URL of this backend; used to build avatar image URLs.
frontend.ip.address=${FRONTEND-IP-ADDRESS:http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
