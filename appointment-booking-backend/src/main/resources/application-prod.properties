# Production profile (SPRING_PROFILES_ACTIVE=prod)
# Requires both frontend and backend to be served over HTTPS.

# --- JWT cookie ---
# Secure=true => cookie is only sent over HTTPS.
# The bundled nginx reverse-proxies /api to the backend, so the app is same-origin
# and SameSite=Lax works (first-party cookie). If you instead host the backend on a
# DIFFERENT registrable domain (cross-site), switch same-site to None (only valid with Secure=true).
app.cookie.secure=true
app.cookie.same-site=Lax

# --- CORS ---
# Comma-separated list of allowed frontend origins, supplied via environment.
# e.g. CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Schema: never auto-migrate in prod ---
# 'validate' checks the existing schema matches the entities and fails fast on drift.
# Defaults to 'validate'; overridable via the HIBERNATE_DDL env var so a brand-new
# database can be bootstrapped once with a one-off `HIBERNATE_DDL=update` run
# (see DEPLOYMENT.md), then left at the default. For versioned schema evolution,
# adopt Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:validate}

# --- Logging: quiet by default, no SQL dumps ---
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
spring.jpa.properties.hibernate.format_sql=false

# --- Actuator: expose only the health endpoint (used by the container healthcheck) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
