# Production profile (default — SPRING_PROFILES_ACTIVE=prod)
# Requires both frontend and backend to be served over HTTPS.
# Secure=true => cookie is only sent over HTTPS.
# SameSite=None is needed when the frontend and backend live on DIFFERENT registrable
# domains (cross-site). SameSite=None is only valid together with Secure=true.
# If your prod frontend and backend share the same registrable domain (e.g. app.example.com
# + api.example.com), change this to Strict for stronger CSRF protection.
app.cookie.secure=true
app.cookie.same-site=None
