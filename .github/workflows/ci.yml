name: CI

# Build & test the backend and frontend on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appointment-booking-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests use the embedded H2 database + generated JWT keys,
      # so no database, secrets or key files are needed.
      - name: Build & test
        run: mvn -B verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appointment-booking-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: appointment-booking-frontend/package-lock.json
      - run: npm ci
      # Bundles with Vite only; `npm run build` would also type-check (tsc), which
      # currently fails on unused-variable errors. The generated API client is
      # committed under src/API — see README.md "Regenerating the API client".
      - run: npx vite build
